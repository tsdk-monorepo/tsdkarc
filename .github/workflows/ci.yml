# .github/workflows/ci.yml
#
# Runs on push to expirements and on all pull requests. No publish — releases are tag-driven via publish.yml.
# Tags are explicitly excluded so CI does not double-run alongside publish.yml on release.
#
# Dependency graph:
#   tsdkarc
#   ├── tsdkarc-x  (parallel)
#   └── tsdkbundle (parallel)
#       └── e2e-tests (needs both tsdkarc-x and tsdkbundle)

name: CI

on:
  push:
    branches:
      - main
    paths:
      - "tsdkarc/**/*.ts"
      - "tsdkarc/**/*.tsx"
      - "tsdkarc/package.json"
      - "tsdkarc-x/**/*.ts"
      - "tsdkarc-x/**/*.tsx"
      - "tsdkarc-x/package.json"
      - "tsdkbundle/**/*.ts"
      - "tsdkbundle/**/*.tsx"
      - "tsdkbundle/package.json"
      - "e2e-tests/**/*.ts"
      - "e2e-tests/**/*.tsx"
      - "e2e-tests/package.json"
      - "e2e-tests/react-client/package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tsdkarc/**/*.ts"
      - "tsdkarc/**/*.tsx"
      - "tsdkarc/package.json"
      - "tsdkarc-x/**/*.ts"
      - "tsdkarc-x/**/*.tsx"
      - "tsdkarc-x/package.json"
      - "tsdkbundle/**/*.ts"
      - "tsdkbundle/**/*.tsx"
      - "tsdkbundle/package.json"
      - "e2e-tests/**/*.ts"
      - "e2e-tests/**/*.tsx"
      - "e2e-tests/package.json"
      - "e2e-tests/react-client/package.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  # ── 1. tsdkarc ──────────────────────────────────────────────────────────────
  build-tsdkarc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies(root)
        run: bun install --force

      - name: Install dependencies
        run: bun install --force
        working-directory: tsdkarc

      - name: Typecheck
        run: bun run checktype
        working-directory: tsdkarc

      - name: Build
        run: bun run build
        working-directory: tsdkarc

      - name: Test
        run: bun run test
        working-directory: tsdkarc

      - uses: actions/upload-artifact@v4
        with:
          name: dist-tsdkarc-esm
          path: tsdkarc/esm
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tsdkarc-lib
          path: tsdkarc/lib
          retention-days: 1

  # ── 2a. tsdkarc-x (depends on tsdkarc) ─────────────────────────────────────
  build-tsdkarc-x:
    needs: build-tsdkarc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      # Restore tsdkarc dist before bun install — postinstall scripts may
      # reference tsdkarc/dist and will fail if it does not exist yet.
      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-esm
          path: tsdkarc/esm
      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-lib
          path: tsdkarc/lib

      - name: Install dependencies(root)
        run: bun install --force

      - name: Install dependencies
        run: bun install --force
        working-directory: tsdkarc-x

      - name: Typecheck
        run: bun run checktype
        working-directory: tsdkarc-x

      - name: Build
        run: bun run build
        working-directory: tsdkarc-x

      - name: Test
        run: bun run test
        working-directory: tsdkarc-x

      - uses: actions/upload-artifact@v4
        with:
          name: dist-tsdkarc-x-esm
          path: tsdkarc-x/esm
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tsdkarc-x-lib
          path: tsdkarc-x/lib
          retention-days: 1

  # ── 2b. tsdkbundle (depends on tsdkarc, parallel with tsdkarc-x) ────────────
  build-tsdkbundle:
    needs: build-tsdkarc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-esm
          path: tsdkarc/esm
      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-lib
          path: tsdkarc/lib

      - name: Install dependencies(root)
        run: bun i

      - name: Install dependencies
        run: bun install
        working-directory: tsdkbundle

      - name: Typecheck
        run: bun run checktype
        working-directory: tsdkbundle

      - name: Build
        run: bun run build
        working-directory: tsdkbundle

      - name: Test
        run: bun run test
        working-directory: tsdkbundle
  # ── 3. e2e-tests (depends on tsdkarc, tsdkarc-x, and tsdkbundle) ────────────
  e2e-tests:
    needs: [build-tsdkarc, build-tsdkarc-x, build-tsdkbundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-esm
          path: tsdkarc/esm
      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-lib
          path: tsdkarc/lib

      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-x-esm
          path: tsdkarc-x/esm
      - uses: actions/download-artifact@v4
        with:
          name: dist-tsdkarc-x-lib
          path: tsdkarc-x/lib

      - name: Install tsdkarc dependencies
        run: bun install
        working-directory: tsdkarc

      - name: Install tsdkarc-x dependencies
        run: bun install
        working-directory: tsdkarc-x

      - name: Relink local dependencies for tsdkarc-x
        # tsdkarc-x's devDependencies "tsdkarc" and "tsdkbundle" use the
        # file:../X protocol. Bun does not reliably pick up freshly
        # rebuilt esm/lib content through this protocol (see the
        # checktype script in tsdkarc-x/package.json, which uses this
        # same rm -rf + cp -r pattern as its own workaround).
        run: |
          rm -rf node_modules/tsdkarc
          cp -r ../tsdkarc node_modules/tsdkarc
        working-directory: tsdkarc-x

      - name: Install e2e-tests dependencies
        run: npm install
        working-directory: e2e-tests

      - name: Relink local dependencies for e2e-tests
        # e2e-tests depends on tsdkarc and tsdkarc-x via the same
        # file:../X protocol as above — same staleness issue applies here.
        # The previous step must run first so tsdkarc-x's own
        # node_modules/tsdkarc is already populated before it's copied in,
        # since server.js resolves 'tsdkarc' relative to tsdkarc-x's own
        # real (symlink-resolved) path.
        run: |
          rm -rf node_modules/tsdkarc
          cp -r ../tsdkarc node_modules/tsdkarc
          rm -rf node_modules/tsdkarc-x
          cp -r ../tsdkarc-x node_modules/tsdkarc-x
        working-directory: e2e-tests

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: e2e-tests

      - name: Test
        run: bun run test
        working-directory: e2e-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report
          retention-days: 7
