# .github/workflows/publish.yml
#
# Trigger: push a tag like  tsdkarc@1.2.3  or  tsdkarc-x@1.2.3-alpha.1
# Packages live at:  <repo-root>/tsdkarc/  tsdkarc-x/  tsdkbundle/
# tsdkarc-x and tsdkbundle depend on tsdkarc's built dist, so tsdkarc is built first for those.
# Bun is used throughout, mirroring the working single-package release.yml.

name: Publish

on:
  push:
    tags:
      - "tsdkarc@*"
      - "tsdkarc-x@*"
      - "tsdkbundle@*"

permissions:
  contents: write # create GitHub release
  id-token: write # npm provenance

# ── 1. Parse tag ────────────────────────────────────────────────────────────
jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
      npm_tag: ${{ steps.parse.outputs.npm_tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      needs_tsdkarc: ${{ steps.parse.outputs.needs_tsdkarc }}
    steps:
      - id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE="${TAG%%@*}"
          VERSION="${TAG##*@}"

          # Validate semver loosely (e.g. 1.2.3 or 1.2.3-alpha.1)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]'; then
            echo "ERROR: tag version '$VERSION' is not semver — got: $VERSION"
            exit 1
          fi

          # Validate package name is one of the known packages
          if [[ "$PACKAGE" != "tsdkarc" && "$PACKAGE" != "tsdkarc-x" && "$PACKAGE" != "tsdkbundle" ]]; then
            echo "ERROR: unknown package '$PACKAGE'. Must be tsdkarc, tsdkarc-x, or tsdkbundle."
            exit 1
          fi

          # tsdkarc-x and tsdkbundle depend on tsdkarc's built dist
          NEEDS_TSDKARC="false"
          if [[ "$PACKAGE" == "tsdkarc-x" || "$PACKAGE" == "tsdkbundle" ]]; then
            NEEDS_TSDKARC="true"
          fi

          # Mirror the npm tag logic from release.yml.
          # Store patterns in variables — bash ERE does not support grouping inside [[ =~ ]]
          # when the pattern is written inline with special chars like ( | ).
          ALPHA_PAT="-alpha"
          BETA_PAT="-beta"
          if [[ "$VERSION" =~ $ALPHA_PAT ]] || [[ "$VERSION" =~ $BETA_PAT ]]; then
            NPM_TAG="next"
            IS_PRERELEASE="true"
            echo "📦 Pre-release detected: $TAG (npm tag: next)"
          else
            NPM_TAG="latest"
            IS_PRERELEASE="false"
            echo "📦 Stable release detected: $TAG (npm tag: latest)"
          fi

          echo "package=$PACKAGE"           >> $GITHUB_OUTPUT
          echo "version=$VERSION"           >> $GITHUB_OUTPUT
          echo "npm_tag=$NPM_TAG"           >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "needs_tsdkarc=$NEEDS_TSDKARC"       >> $GITHUB_OUTPUT

  # ── 2. Build tsdkarc (only when publishing tsdkarc-x or tsdkbundle) ──────────
  build-tsdkarc:
    needs: parse-tag
    if: needs.parse-tag.outputs.needs_tsdkarc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck and build tsdkarc
        run: |
          cd tsdkarc
          bun run checktype
          bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist-tsdkarc
          path: tsdkarc/dist
          retention-days: 1

  # ── 3. Build + verify the target package ────────────────────────────────────
  build:
    needs: [parse-tag, build-tsdkarc]
    # build-tsdkarc is 'skipped' when publishing tsdkarc itself (no dependency needed).
    # Explicitly allow skipped so build still runs for tsdkarc,
    # but block on any actual failure of either upstream job.
    if: "always() && needs.parse-tag.result == 'success' && (needs.build-tsdkarc.result == 'success' || needs.build-tsdkarc.result == 'skipped')"
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ needs.parse-tag.outputs.package }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Restore tsdkarc dist when it was built as a dependency.
      # Step-level if: cannot access needs.* context — use the needs_tsdkarc output
      # from parse-tag which was already resolved at job level.
      - uses: actions/download-artifact@v4
        if: needs.parse-tag.outputs.needs_tsdkarc == 'true'
        with:
          name: dist-tsdkarc
          path: tsdkarc/dist

      - name: Typecheck and build ${{ env.PACKAGE }}
        run: |
          cd $PACKAGE
          bun run checktype
          bun run build

      # Mirror the version-guard from publish.yml — fail fast before touching npm
      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./$PACKAGE/package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "ERROR: $PACKAGE/package.json has version $PKG_VERSION but tag says $VERSION"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}/dist
          retention-days: 1

  # ── 4. Publish ───────────────────────────────────────────────────────────────
  publish:
    needs: [parse-tag, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ needs.parse-tag.outputs.package }}
      VERSION: ${{ needs.parse-tag.outputs.version }}
      NPM_TAG: ${{ needs.parse-tag.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}/dist

      # Mirror purge-pkg-for-publish from release.yml — adjust path if the
      # script lives at repo root or inside each package folder.
      - name: Prepare package for publish
        run: node scripts/purge-pkg-for-publish.mjs
        working-directory: ${{ env.PACKAGE }}

      - name: Verify package contents (dry run)
        run: npm pack --dry-run
        working-directory: ${{ env.PACKAGE }}

      - name: Publish to npm
        run: npm publish --access public --no-git-checks --provenance --tag=${{ env.NPM_TAG }}
        working-directory: ${{ env.PACKAGE }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.PACKAGE }} v${{ env.VERSION }}"
          prerelease: ${{ needs.parse-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
